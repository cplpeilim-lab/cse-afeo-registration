  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"9dca70e9-4771-4e5a-8010-1659253b8743\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n<style>\n  :root{\n    --navy:#0F2D5C;\n    --blue:#1E5BAA;\n    --cyan:#9CD3EE;\n    --red:#C8202B;\n    --paper:#FFFFFF;\n    --soft:#F4F7FB;\n    --line:#D9E2EC;\n    --ink:#0F2D5C;\n    --muted:#5B6B82;\n    --ok:#1B7F4A;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{background:#EEF2F8;font-family:\"Manrope\",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}\n  body{display:flex;justify-content:center;padding:32px 16px;min-height:100vh}\n\n  .form-wrap{\n    width:100%;max-width:760px;\n    display:flex;flex-direction:column;gap:18px;\n  }\n\n  /* ===== HEADER CARD ===== */\n  .hero{\n    background:var(--navy);\n    color:#fff;\n    border-radius:8px 8px 0 0;\n    padding:36px 40px 28px;\n    position:relative;overflow:hidden;\n    border-top:8px solid var(--red);\n  }\n  .hero::after{\n    content:\"\";position:absolute;right:-60px;top:-60px;\n    width:240px;height:240px;background:var(--blue);opacity:.3;\n    transform:rotate(45deg);\n  }\n  .hero::before{\n    content:\"\";position:absolute;right:80px;top:-100px;\n    width:180px;height:180px;background:var(--cyan);opacity:.18;\n    transform:rotate(45deg);\n  }\n  .logos{\n    display:flex;align-items:center;gap:14px;\n    position:relative;z-index:2;\n    padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.18);\n    margin-bottom:24px;\n  }\n  .logos img.iem{height:44px;background:#fff;padding:6px 10px;border-radius:4px}\n  .logos img.yeafeo{height:50px;background:#fff;padding:4px 8px;border-radius:4px}\n  .logos img.aer{height:42px;border-radius:4px;display:block}\n  .logos .cap{\n    font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;\n    color:#A8C5E8;font-weight:600;line-height:1.4;text-align:center;\n    padding:0 6px;\n  }\n  .logos .cap b{display:block;color:#fff;font-size:10.5px;letter-spacing:.2em;font-weight:700;margin-top:2px}\n\n  .hero h1{\n    position:relative;z-index:2;\n    font-size:32px;line-height:1.1;letter-spacing:-.015em;font-weight:700;\n    margin-bottom:10px;\n  }\n  .hero h1 em{font-style:normal;color:var(--cyan)}\n  .hero p{\n    position:relative;z-index:2;\n    font-size:14.5px;line-height:1.55;color:#C9D9EE;font-weight:400;\n    max-width:560px;\n  }\n\n  /* ===== INFO BAND ===== */\n  .info{\n    background:#fff;\n    border-left:5px solid var(--red);\n    padding:14px 20px;\n    display:flex;gap:18px;flex-wrap:wrap;align-items:center;\n    font-size:12.5px;color:var(--ink);\n    border-radius:0;\n    box-shadow:0 1px 0 var(--line);\n  }\n  .info .l{\n    font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;\n    color:var(--muted);font-weight:700;\n    padding-right:14px;border-right:1px solid var(--line);\n  }\n  .info b{color:var(--navy);font-weight:600}\n  .info .no{color:var(--red);font-weight:600}\n\n  /* ===== SECTIONS ===== */\n  .section{\n    background:#fff;\n    padding:28px 40px;\n    border-bottom:1px solid var(--line);\n  }\n  .section:last-of-type{\n    border-radius:0 0 8px 8px;\n    border-bottom:none;\n  }\n  .section h2{\n    font-size:11px;letter-spacing:.24em;text-transform:uppercase;\n    color:var(--blue);font-weight:700;margin-bottom:6px;\n  }\n  .section .h-sub{\n    font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--navy);\n    margin-bottom:22px;\n  }\n\n  .grid{\n    display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;\n  }\n  .field{display:flex;flex-direction:column;gap:6px}\n  .field.full{grid-column:span 2}\n  .field label{\n    font-size:12px;font-weight:600;color:var(--navy);\n    display:flex;align-items:center;gap:6px;\n  }\n  .field label .req{color:var(--red);font-weight:700}\n  .field .hint{\n    font-size:11px;color:var(--muted);font-weight:400;margin-top:-2px;\n  }\n\n  input[type=\"text\"],input[type=\"email\"],input[type=\"tel\"],select,textarea{\n    width:100%;\n    background:var(--soft);\n    border:1px solid var(--line);\n    border-radius:5px;\n    padding:11px 12px;\n    font-family:inherit;font-size:14px;color:var(--ink);\n    transition:border-color .15s, background .15s;\n  }\n  input:focus,select:focus,textarea:focus{\n    outline:none;border-color:var(--blue);background:#fff;\n    box-shadow:0 0 0 3px rgba(30,91,170,.12);\n  }\n  textarea{resize:vertical;min-height:80px}\n  select{\n    appearance:none;\n    background-image:url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%230F2D5C' stroke-width='1.5' fill='none' stroke-linecap='round'/><\u002Fsvg>\");\n    background-repeat:no-repeat;background-position:right 14px center;\n    padding-right:36px;\n  }\n\n  /* phone with country code */\n  .phone-row{display:grid;grid-template-columns:110px 1fr;gap:8px}\n\n  /* session checklist */\n  .sessions{display:flex;flex-direction:column;gap:8px;margin-top:4px}\n  .session-opt{\n    display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:12px;\n    padding:12px 14px;\n    background:var(--soft);\n    border:1.5px solid var(--line);\n    border-radius:6px;\n    cursor:pointer;\n    transition:all .15s;\n  }\n  .session-opt:hover{border-color:var(--blue);background:#fff}\n  .session-opt input{\n    appearance:none;width:18px;height:18px;border:1.5px solid var(--line);\n    border-radius:3px;background:#fff;cursor:pointer;\n    position:relative;\n  }\n  .session-opt input:checked{background:var(--navy);border-color:var(--navy)}\n  .session-opt input:checked::after{\n    content:\"\";position:absolute;left:4px;top:1px;\n    width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;\n    transform:rotate(45deg);\n  }\n  .session-opt:has(input:checked){border-color:var(--navy);background:#fff}\n  .session-opt .s-num{\n    font-size:11px;letter-spacing:.18em;color:var(--red);font-weight:700;\n    text-transform:uppercase;\n  }\n  .session-opt .s-title{font-size:14px;font-weight:600;color:var(--navy);line-height:1.3;margin-top:2px}\n  .session-opt .s-meta{\n    font-family:\"Manrope\",sans-serif;\n    font-size:11px;color:var(--muted);font-weight:500;text-align:right;\n    line-height:1.5;\n  }\n  .session-opt .s-meta b{display:block;color:var(--ink);font-weight:600;font-size:12px}\n\n  /* consent */\n  .consent{\n    display:flex;align-items:flex-start;gap:10px;\n    font-size:12.5px;line-height:1.5;color:var(--muted);\n    padding:14px 16px;background:var(--soft);border-radius:6px;\n    margin-top:8px;\n  }\n  .consent input{margin-top:2px;width:16px;height:16px;accent-color:var(--navy);flex-shrink:0}\n  .consent a{color:var(--blue);text-decoration:underline}\n\n  /* footer / submit */\n  .submit-bar{\n    background:var(--navy);\n    border-radius:0 0 8px 8px;\n    padding:24px 40px;\n    display:flex;justify-content:space-between;align-items:center;gap:16px;\n    color:#fff;\n  }\n  .submit-bar .req-note{\n    font-size:11.5px;color:#A8C5E8;letter-spacing:.04em;\n  }\n  .submit-bar .req-note .req{color:var(--red)}\n  button.submit{\n    background:var(--red);color:#fff;\n    border:none;padding:14px 28px;border-radius:6px;\n    font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.08em;\n    text-transform:uppercase;cursor:pointer;\n    transition:transform .1s, background .15s;\n  }\n  button.submit:hover{background:#A6181F}\n  button.submit:active{transform:translateY(1px)}\n  button.submit:disabled{background:#7B8B97;cursor:not-allowed;transform:none}\n\n  .error-bar{\n    display:none;\n    background:#FDECEE;color:#A6181F;\n    border:1px solid #F1B4B9;border-radius:6px;\n    padding:14px 18px;font-size:13px;line-height:1.5;\n    margin-top:8px;\n  }\n  .error-bar.show{display:block}\n\n  /* success state */\n  .success{\n    display:none;\n    background:#fff;border-radius:8px;padding:48px 40px;text-align:center;\n    border-top:8px solid var(--ok);\n  }\n  .success.show{display:block}\n  .success .check{\n    width:64px;height:64px;border-radius:50%;background:var(--ok);\n    margin:0 auto 20px;display:flex;align-items:center;justify-content:center;\n    position:relative;\n  }\n  .success .check::after{\n    content:\"\";\n    width:14px;height:24px;\n    border:solid #fff;border-width:0 4px 4px 0;\n    transform:translate(0,-3px) rotate(45deg);\n  }\n  .success h3{font-size:24px;color:var(--navy);margin-bottom:8px;letter-spacing:-.01em}\n  .success p{color:var(--muted);font-size:14px;line-height:1.5;max-width:420px;margin:0 auto}\n\n  .meta{\n    text-align:center;font-size:11px;color:var(--muted);\n    letter-spacing:.12em;text-transform:uppercase;\n    padding:12px 0 4px;\n  }\n\n  @media (max-width:640px){\n    .hero,.section,.submit-bar{padding-left:24px;padding-right:24px}\n    .grid{grid-template-columns:1fr}\n    .field.full{grid-column:span 1}\n    .hero h1{font-size:26px}\n    .submit-bar{flex-direction:column;align-items:stretch}\n    button.submit{width:100%}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"form-wrap\">\n\n  <!-- form -->\n  <form id=\"reg-form\" novalidate=\"\">\n\n    <!-- ============ HERO ============ -->\n    <header class=\"hero\">\n      <div class=\"logos\">\n        <img class=\"iem\" src=\"0478b061-3700-452c-89de-ecf67e91df35\" alt=\"IEM YES\">\n        <div class=\"cap\">In Partnership<br><b>For CSE 2026<\u002Fb><\u002Fdiv>\n        <img class=\"yeafeo\" src=\"005af40a-699b-459b-90b7-2d7ee2b04cdb\" alt=\"YEAFEO\">\n        <img class=\"aer\" src=\"f7d5fbe6-3667-4c62-bb53-3752961ed41a\" alt=\"ASEAN Engineering Register\">\n      <\u002Fdiv>\n      <h1>CSE 2026 — <em>Registration of Interest<\u002Fem><\u002Fh1>\n      <p>Express your interest to join one of the 5 CSE × AFEO Capability Building sessions in China, August–September 2026. Your details will be reviewed by your national delegation lead.<\u002Fp>\n    <\u002Fheader>\n\n    <!-- ============ INFO ============ -->\n    <div class=\"info\">\n      <span class=\"l\">What's Included<\u002Fspan>\n      <span><b>Accommodation<\u002Fb><\u002Fspan>\n      <span><b>Meals<\u002Fb><\u002Fspan>\n      <span><b>Local Transport<\u002Fb><\u002Fspan>\n      <span><b>Program Fees<\u002Fb><\u002Fspan>\n      <span class=\"no\">International Flights — Not Included<\u002Fspan>\n    <\u002Fdiv>\n\n    <!-- ============ PERSONAL ============ -->\n    <section class=\"section\">\n      <h2>Section 01<\u002Fh2>\n      <div class=\"h-sub\">Personal Information<\u002Fdiv>\n      <div class=\"grid\">\n        <div class=\"field full\">\n          <label>Full Name <span class=\"req\">*<\u002Fspan><\u002Flabel>\n          <div class=\"hint\">As shown on passport<\u002Fdiv>\n          <input type=\"text\" name=\"full_name\" placeholder=\"e.g. Ahmad bin Ismail\" required=\"\">\n        <\u002Fdiv>\n\n        <div class=\"field\">\n          <label>Email Address <span class=\"req\">*<\u002Fspan><\u002Flabel>\n          <input type=\"email\" name=\"email\" placeholder=\"you@example.com\" required=\"\">\n        <\u002Fdiv>\n\n        <div class=\"field\">\n          <label>Phone Number <span class=\"req\">*<\u002Fspan><\u002Flabel>\n          <div class=\"phone-row\">\n            <select name=\"phone_cc\" required=\"\">\n              <option value=\"\">Code<\u002Foption>\n              <option value=\"+673\">+673 BN<\u002Foption>\n              <option value=\"+855\">+855 KH<\u002Foption>\n              <option value=\"+62\">+62 ID<\u002Foption>\n              <option value=\"+856\">+856 LA<\u002Foption>\n              <option value=\"+60\" selected=\"\">+60 MY<\u002Foption>\n              <option value=\"+95\">+95 MM<\u002Foption>\n              <option value=\"+63\">+63 PH<\u002Foption>\n              <option value=\"+65\">+65 SG<\u002Foption>\n              <option value=\"+66\">+66 TH<\u002Foption>\n              <option value=\"+84\">+84 VN<\u002Foption>\n            <\u002Fselect>\n            <input type=\"tel\" name=\"phone\" placeholder=\"12 345 6789\" required=\"\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"field\">\n          <label>Country of Residence <span class=\"req\">*<\u002Fspan><\u002Flabel>\n          <select name=\"country\" required=\"\">\n            <option value=\"\">Select country<\u002Foption>\n            <option>Brunei Darussalam<\u002Foption>\n            <option>Cambodia<\u002Foption>\n            <option>Indonesia<\u002Foption>\n            <option>Lao PDR<\u002Foption>\n            <option>Malaysia<\u002Foption>\n            <option>Myanmar<\u002Foption>\n            <option>Philippines<\u002Foption>\n            <option>Singapore<\u002Foption>\n            <option>Thailand<\u002Foption>\n            <option>Vietnam<\u002Foption>\n            <option>Other<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n\n        <div class=\"field\">\n          <label>Passport Number <span class=\"req\">*<\u002Fspan><\u002Flabel>\n          <div class=\"hint\">Required for travel arrangements<\u002Fdiv>\n          <input type=\"text\" name=\"passport\" placeholder=\"A12345678\" required=\"\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ ORG ============ -->\n    <section class=\"section\">\n      <h2>Section 02<\u002Fh2>\n      <div class=\"h-sub\">AFEO Member Organisation<\u002Fdiv>\n      <div class=\"grid\">\n        <div class=\"field full\">\n          <label>Your Organisation <span class=\"req\">*<\u002Fspan><\u002Flabel>\n          <div class=\"hint\">Select the AFEO member body you are nominated through<\u002Fdiv>\n          <select name=\"organisation\" required=\"\">\n            <option value=\"\">Select organisation<\u002Foption>\n            <option value=\"PUJA\">PUJA — Pertubuhan Ukur, Jurutera &amp; Arkitek (Brunei Darussalam)<\u002Foption>\n            <option value=\"CES\">CES — Cambodian Engineering Society (Cambodia)<\u002Foption>\n            <option value=\"PII\">PII — Persatuan Insinyur Indonesia (Indonesia)<\u002Foption>\n            <option value=\"LUSEA\">LUSEA — Lao Union of Science and Engineering Associations (Lao PDR)<\u002Foption>\n            <option value=\"IEM\">IEM — The Institution of Engineers, Malaysia<\u002Foption>\n            <option value=\"MES\">MES — Myanmar Engineering Society (Myanmar)<\u002Foption>\n            <option value=\"PTC\">PTC — Philippine Technological Council (Philippines)<\u002Foption>\n            <option value=\"IES\">IES — The Institution of Engineers, Singapore<\u002Foption>\n            <option value=\"EIT\">EIT — The Engineering Institute of Thailand (Thailand)<\u002Foption>\n            <option value=\"VFEA\">VFEA — Vietnam Federation of Engineering Associations (Vietnam)<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n\n        <div class=\"field\">\n          <label>Membership ID / No.<\u002Flabel>\n          <div class=\"hint\">Optional, if applicable<\u002Fdiv>\n          <input type=\"text\" name=\"member_id\" placeholder=\"e.g. IEM/YES/12345\">\n        <\u002Fdiv>\n\n        <div class=\"field\">\n          <label>Job Title / Role<\u002Flabel>\n          <input type=\"text\" name=\"title\" placeholder=\"e.g. Civil Engineer\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ SESSIONS ============ -->\n    <section class=\"section\">\n      <h2>Section 03<\u002Fh2>\n      <div class=\"h-sub\">Session(s) of Interest<\u002Fdiv>\n      <div class=\"hint\" style=\"margin-top:-14px;margin-bottom:14px;color:var(--muted);font-size:13px\">Select all that apply. Final placement is subject to availability and delegation approval.<\u002Fdiv>\n      <div class=\"sessions\">\n\n        <label class=\"session-opt\">\n          <input type=\"checkbox\" name=\"sessions\" value=\"06\">\n          <div>\n            <div class=\"s-num\">No. 06 · Transport Infrastructure<\u002Fdiv>\n            <div class=\"s-title\">Intelligent &amp; Green Technologies Leading the Interconnection of Transport Infrastructure<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s-meta\"><b>14–19 Aug 2026<\u002Fb>Nanjing &amp; Yangzhou<\u002Fdiv>\n        <\u002Flabel>\n\n        <label class=\"session-opt\">\n          <input type=\"checkbox\" name=\"sessions\" value=\"07\">\n          <div>\n            <div class=\"s-num\">No. 07 · Low-Carbon Energy<\u002Fdiv>\n            <div class=\"s-title\">Engineering Synergy Promoting Low-Carbon Energy<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s-meta\"><b>16–21 Aug 2026<\u002Fb>Taiyuan, Shanxi<\u002Fdiv>\n        <\u002Flabel>\n\n        <label class=\"session-opt\">\n          <input type=\"checkbox\" name=\"sessions\" value=\"08\">\n          <div>\n            <div class=\"s-num\">No. 08 · Intelligent Dam<\u002Fdiv>\n            <div class=\"s-title\">Digital Intelligence-driven Construction, Operation &amp; Maintenance of Reservoir Dams<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s-meta\"><b>5–10 Sep 2026<\u002Fb>Chengdu, Sichuan<\u002Fdiv>\n        <\u002Flabel>\n\n        <label class=\"session-opt\">\n          <input type=\"checkbox\" name=\"sessions\" value=\"10\">\n          <div>\n            <div class=\"s-num\">No. 10 · Intelligent Manufacturing<\u002Fdiv>\n            <div class=\"s-title\">Green Engineering, Low-Carbon City<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s-meta\"><b>13–18 Sep 2026<\u002Fb>Beijing<\u002Fdiv>\n        <\u002Flabel>\n\n        <label class=\"session-opt\">\n          <input type=\"checkbox\" name=\"sessions\" value=\"11\">\n          <div>\n            <div class=\"s-num\">No. 11 · Energy &amp; Power<\u002Fdiv>\n            <div class=\"s-title\">Nuclear for a Green Future — Global Innovation &amp; Transition<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s-meta\"><b>16–21 Sep 2026<\u002Fb>Nanning, Guangxi<\u002Fdiv>\n        <\u002Flabel>\n\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ DIETARY / NOTES ============ -->\n    <section class=\"section\">\n      <h2>Section 04<\u002Fh2>\n      <div class=\"h-sub\">Additional Information<\u002Fdiv>\n      <div class=\"grid\">\n        <div class=\"field\">\n          <label>Dietary Requirements<\u002Flabel>\n          <select name=\"dietary\">\n            <option value=\"\">No restrictions<\u002Foption>\n            <option>Halal<\u002Foption>\n            <option>Vegetarian<\u002Foption>\n            <option>Vegan<\u002Foption>\n            <option>Other (please specify in notes)<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label>Emergency Contact<\u002Flabel>\n          <div class=\"hint\">Name &amp; phone number<\u002Fdiv>\n          <input type=\"text\" name=\"emergency\" placeholder=\"Name · +60 12 345 6789\">\n        <\u002Fdiv>\n        <div class=\"field full\">\n          <label>Notes / Special Requirements<\u002Flabel>\n          <textarea name=\"notes\" placeholder=\"Anything else the delegation should know...\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <label class=\"consent\">\n        <input type=\"checkbox\" name=\"consent\" required=\"\">\n        <span>I consent to my personal information being used for the purpose of registration, travel coordination and communication for the CSE × AFEO Capability Building 2026 programme. I understand my data will be handled in line with the organisers' privacy policy. <span class=\"req\" style=\"color:var(--red)\">*<\u002Fspan><\u002Fspan>\n      <\u002Flabel>\n    <\u002Fsection>\n\n    <!-- ============ SUBMIT ============ -->\n    <div class=\"submit-bar\">\n      <div class=\"req-note\"><span class=\"req\">*<\u002Fspan> Required fields<\u002Fdiv>\n      <button type=\"submit\" class=\"submit\" id=\"submit-btn\">Submit Registration<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div class=\"error-bar\" id=\"error-bar\">Something went wrong while sending your registration. Please try again, or contact your delegation lead directly.<\u002Fdiv>\n\n  <\u002Fform>\n\n  <!-- success view -->\n  <div class=\"success\" id=\"success\">\n    <div class=\"check\"><\u002Fdiv>\n    <h3>Registration Received<\u002Fh3>\n    <p>Thank you. Your interest has been recorded and will be reviewed by your national delegation lead. You'll hear back via email within 5 working days.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"meta\">IEM YES · YEAFEO · AER · CSE 2026<\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n  // ====== CONFIGURE ME ======\n  // Paste your deployed Google Apps Script Web App URL here:\n  const APPS_SCRIPT_URL = \"https://script.google.com/macros/s/AKfycbxuQc4ZvDesFQDGO6jlb-LvVOJ7oXtkYcVP9NAbcgJhMNNlGrx8HtFKhtTj_OtXWnEp2g/exec\";\n  // ==========================\n\n  const form = document.getElementById('reg-form');\n  const success = document.getElementById('success');\n  const errorBar = document.getElementById('error-bar');\n  const btn = document.getElementById('submit-btn');\n\n  form.addEventListener('submit', async (e) => {\n    e.preventDefault();\n    errorBar.classList.remove('show');\n\n    if (!form.checkValidity()) {\n      form.reportValidity();\n      return;\n    }\n\n    // Collect data\n    const data = Object.fromEntries(new FormData(form));\n    data.sessions = [...form.querySelectorAll('input[name=sessions]:checked')].map(i => i.value);\n    data.consent = !!form.querySelector('input[name=consent]').checked;\n\n    btn.disabled = true;\n    btn.textContent = 'Sending…';\n\n    try {\n      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.startsWith(\"PASTE_\")) {\n        throw new Error(\"APPS_SCRIPT_URL not configured yet.\");\n      }\n      // text/plain avoids a CORS preflight; Apps Script reads e.postData.contents\n      const res = await fetch(APPS_SCRIPT_URL, {\n        method: 'POST',\n        body: JSON.stringify(data),\n        headers: { 'Content-Type': 'text/plain;charset=utf-8' },\n        redirect: 'follow'\n      });\n      // Apps Script returns JSON; verify ok flag if readable.\n      try {\n        const json = await res.json();\n        if (!json.ok) throw new Error(json.error || 'Server rejected the submission.');\n      } catch (_) {\n        // Even if the response can't be parsed, a 200/302 from Apps Script usually means it saved.\n        if (!res.ok && res.type !== 'opaqueredirect') throw new Error('HTTP ' + res.status);\n      }\n\n      form.style.display = 'none';\n      success.classList.add('show');\n      window.scrollTo({top:0, behavior:'smooth'});\n    } catch (err) {\n      console.error('Submit failed:', err);\n      errorBar.textContent = 'Could not submit: ' + err.message + ' Please try again or contact your delegation lead.';\n      errorBar.classList.add('show');\n      btn.disabled = false;\n      btn.textContent = 'Submit Registration';\n    }\n  });\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
